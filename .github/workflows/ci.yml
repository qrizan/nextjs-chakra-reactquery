name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Action dipin ke commit SHA; komentar versi di sebelahnya untuk keterbacaan.

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # `next build` juga menjalankan type-check TypeScript; tidak ada
      # langkah tsc terpisah.
      - name: Build
        run: pnpm build

      # Ambang `critical` sengaja lebih longgar dari repo lain di ekosistem
      # ini (`high`): next@14.2.35 punya 10 advisory HIGH yang baru tertutup
      # lewat Next.js 15. Naikkan ke `high` setelah upgrade itu selesai.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level critical
